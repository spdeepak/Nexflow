      go:
        <<: *common_go
        package: "sessionstate"
        out: "./internal/sessionstate"

  - schema:
      - "./migrations/*.up.sql"
    queries: "./sqls/artifacts.sql"
    engine: "sqlite"
    gen:
      go:
        <<: *common_go
        package: "artifacts"
        out: "./internal/artifacts"

  - schema:
      - "./migrations/*.up.sql"
    queries: "./sqls/runs.sql"
    engine: "sqlite"
    gen:
      go:
        <<: *common_go
        package: "runs"
        out: "./internal/runs"

  - schema:
      - "./migrations/*.up.sql"
    queries: "./sqls/tool_calls.sql"
    engine: "sqlite"
    gen:
      go:
        <<: *common_go
        package: "toolcalls"
        out: "./internal/toolcalls"

  - schema:
      - "./migrations/*.up.sql"
    queries: "./sqls/skill.sql"
    engine: "sqlite"
    gen:
      go:
        <<: *common_go
        package: "skills"
        out: "./internal/skills"

  - schema:
      - "./migrations/*.up.sql"
    queries: "./sqls/agent_skill.sql"
    engine: "sqlite"
    gen:
      go:
        <<: *common_go
        package: "agentskills"
        out: "./internal/agentskills"

  - schema:
      - "./migrations/*.up.sql"
    queries: "./sqls/mcp_server.sql"
    engine: "sqlite"
    gen:
      go:
        <<: *common_go
        package: "mcpserver"
